name: Build e Release FluxTweakers (Windows)

# Toda vez que você mudar a versão no package.json e der push, ele builda,
# assina e publica automaticamente uma nova Release no GitHub — e o app
# já instalado detecta essa release sozinho e se atualiza.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias do projeto
        run: npm install

      - name: Compilar, assinar e publicar Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "FluxTweakers v__VERSION__"
          releaseBody: "Nova versão do FluxTweakers, gerada automaticamente."
          releaseDraft: false
          prerelease: false
